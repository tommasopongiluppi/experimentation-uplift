name: Slow tests

# Manual trigger only: the Monte Carlo coverage and simulation checks take several minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    name: Slow tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the dev extras
        run: python -m pip install -e ".[dev]"
      # Synthetic data only; the network tests stay deselected.
      - name: Slow tests
        run: pytest -q -m slow --durations=20
