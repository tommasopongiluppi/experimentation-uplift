name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml requires >= 3.11; 3.13 is the development version.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # The default selection (pyproject.toml) leaves out the slow and network tests. It
      # includes the end-to-end run of `run-all --fast` on the synthetic fixture in
      # tests/fixtures, so no download and no real data are needed.
      - name: Fast tests and end-to-end smoke test, with coverage
        run: pytest -q --durations=10 --cov=abkit --cov-report=term-missing:skip-covered
