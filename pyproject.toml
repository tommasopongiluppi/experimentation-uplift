[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "Experimentation and uplift modelling on the Hillstrom email experiment."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tommaso Pongiluppi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "duckdb>=1.0",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
crosscheck = ["scikit-uplift>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abkit = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow and not network'"
markers = [
    "slow: long-running tests such as Monte Carlo simulations (run with -m slow)",
    "network: tests that need internet access (run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "NPY", "PD", "RUF", "T20", "D"]
ignore = [
    "N803",  # allow X / Y argument names (scikit-learn convention)
    "N806",  # allow X / Y local variable names
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "T20"]
"notebooks/**" = ["D", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["abkit"]
